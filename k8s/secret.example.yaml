# Copy to `secret.yaml` or create via `kubectl create secret generic veritas-secrets ...`
# NEVER commit real secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: veritas-secrets
  namespace: veritas
type: Opaque
stringData:
  # Optional cloud AI provider keys (leave empty for 100% local-only execution)
  GEMINI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
  TOGETHER_API_KEY: ""
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_RANDOM_PASSWORD"
