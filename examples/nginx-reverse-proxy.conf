# Production Nginx reverse-proxy template for Veritas on Linux VPS / Bare Metal
# Supports: TLS, 100MB+ batch/media uploads, and unbuffered SSE job streams.

upstream veritas_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name veritas.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name veritas.example.com;

    ssl_certificate     /etc/letsencrypt/live/veritas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veritas.example.com/privkey.pem;

    client_max_body_size 150M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/v1/jobs/ {
        proxy_pass http://veritas_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://veritas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
