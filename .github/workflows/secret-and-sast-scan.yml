name: Secret Scanning & SAST (Gitleaks, TruffleHog, Semgrep)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog-secret-scan:
    name: TruffleHog Verified Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  semgrep-sast:
    name: Semgrep OWASP & Secrets SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST (OWASP Top 10, Secrets, TypeScript)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/typescript \
            --error

  forbidden-files-guard:
    name: Forbidden Credential & Key File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail if sensitive files are tracked in git
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^\.env$|^\.env\.(?!example).*|\.pem$|\.key$|\.p12$|\.pfx$|credentials\.json$|secrets\.json$|^data/.*\.json$|^k8s/secret\.yaml$)' -P || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Forbidden secret/key files tracked in git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Tracked file hygiene check passed."
