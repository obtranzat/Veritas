name: Feature Request
description: Propose a new detection capability, provider adapter, export format, or UX improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What workflow gap or limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the API, UI, or CLI behavior you envision.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Workspace / Subsystem
      options:
        - Core AI Detection & Pipelines
        - Multimodal Forensics (PDF/DOCX/Image/Audio/Video)
        - Humanization Engine
        - Fact-Checking & Citations
        - Code Forensics & Security Firewall
        - Provenance & Stylometric Twin
        - 11-Tier AI Failover Router
        - REST API / MCP / LTI 1.3
        - Docker / Kubernetes / DevOps
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: I am willing to submit a Pull Request for this feature
